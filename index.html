<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080d1a">
  <title>My Web Tools</title>
  <link rel="stylesheet" href="./css/hub.css">
</head>
<body>
  <div class="hub-container">
    <header class="hub-header">
      <h1 class="hub-title">Tiện ích của tôi</h1>
      <p class="hub-subtitle">Bộ công cụ cá nhân siêu nhẹ & bảo mật</p>
    </header>

    <div class="hub-search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="searchInput" class="hub-search" placeholder="Tìm kiếm công cụ..." autocomplete="off">
    </div>

    <main class="tool-list" id="toolList"></main>
  </div>

  <script type="module">
    import { TOOL_REGISTRY } from './config.js';

    const toolList = document.getElementById('toolList');
    const searchInput = document.getElementById('searchInput');

    function render(query = '') {
      toolList.innerHTML = '';
      const filtered = TOOL_REGISTRY.filter(t => 
        t.name.toLowerCase().includes(query.toLowerCase()) || 
        (t.subtitle && t.subtitle.toLowerCase().includes(query.toLowerCase()))
      );

      filtered.forEach(tool => {
        const a = document.createElement('a');
        a.href = tool.path;
        a.className = 'tool-card-row';
        a.innerHTML = `
          <div class="tool-icon-avatar" style="background: ${tool.bgColor}; color: ${tool.iconColor};">
            ${tool.icon}
          </div>
          <div class="tool-card-info">
            <div class="tool-card-title">${tool.name}</div>
            <div class="tool-card-desc">${tool.subtitle || ''}</div>
          </div>
          <div class="tool-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
        `;
        toolList.appendChild(a);
      });
    }

    searchInput.addEventListener('input', e => render(e.target.value.trim()));
    render();
  </script>
</body>
</html>
